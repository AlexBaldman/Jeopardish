<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeopardish!</title>
    <link rel="stylesheet" href="style.css?v=arcade-1" type="text/css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Press+Start+2P&family=Roboto+Condensed:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.2/css/all.min.css">
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script defer src="game-logic.js?v=arcade-1"></script>
    <script defer src="src/contracts/events.js?v=arcade-1"></script>
    <script defer src="src/core/event-bus.js?v=arcade-1"></script>
    <script defer src="src/core/game-engine.js?v=arcade-1"></script>
    <script defer src="src/data/data-loader.js?v=arcade-1"></script>
    <script defer src="src/render/renderer.js?v=arcade-1"></script>
    <script defer src="src/render/console-narrator.js?v=arcade-1"></script>
    <script defer src="src/host/host-manager.js?v=arcade-1"></script>
    <script defer src="app.js?v=arcade-1"></script>
</head>

<body lang="en" data-theme="dark" data-language="en">

    <!-- GAME CONTAINER -->
    <div class="game-container">

        <!-- HEADER -->
        <header class="header">
            <div class="title-div">
                <img class="title-image" src="https://res.cloudinary.com/alexbaldman/image/upload/c_scale,e_auto_saturation,h_72,q_65,w_373/v1592202698/Jeopardish/title_zldpdq.png" alt="Jeopardish!">
            </div>
            <div class="header-controls" aria-label="Game preferences">
                <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle light or dark mode" aria-pressed="false">
                    <span class="toggle-track" aria-hidden="true">
                        <span class="toggle-bulb"></span>
                    </span>
                    <span class="toggle-label" id="themeToggleLabel">Night</span>
                </button>
                <button class="language-toggle" id="languageToggle" type="button" aria-label="Toggle English or Brazilian Portuguese" aria-pressed="false">
                    <span class="flag-stack" aria-hidden="true">
                        <span class="flag flag-us">US</span>
                        <span class="flag flag-br">BR</span>
                    </span>
                    <span class="toggle-label" id="languageToggleLabel">English</span>
                </button>
            </div>
            <button class="hamburger-menu" id="hamburgerMenu" aria-label="Menu">
                <i class="fas fa-bars"></i>
            </button>
        </header>

        <!-- NAVIGATION MENU -->
        <nav class="nav-menu" id="navMenu">
            <p class="nav-kicker">Cabinet Readout</p>
            <div id="dataBox" class="data-box">
                <p id="currentStreak">Current Streak: 0</p>
                <p id="bestStreak">Best Streak: 0</p>
                <p id="score">Score: $0</p>
            </div>
        </nav>

        <div class="main-content">
            <!-- SPEECH BUBBLE -->
            <div class="speech-bubble">
                <p id="statusMessage" class="status-message" aria-live="polite"></p>
                <div id="categoryBox"></div>
                <div id="questionBox"></div>
                <div id="answerBox"></div>
            </div>

            <!-- TREBEK DIV -->
            <!-- original svg trebek -->
            <img class="trebek" id="hostImage" alt="Long Live Trebek!!!" src="assets/images/trebek-vector.png">

            <!-- new pimped out trebek  -->
            <!-- <img class="trebek" alt="Long Live Trebek!!!" src="assets/images/trebek-6.webp"> -->
        </div>

        <footer class="control-footer" aria-label="Contestant controls">
            <div class="input-div">
                <input type="text" id="inputbox" placeholder="Enter answer" aria-label="Answer input">
                <button id="checkButton" aria-label="Check answer">Check Answer</button>
            </div>
            <div class="button-div">
                <button id="questionButton" aria-label="Get a new question">New Question</button>
                <button id="answerButton" aria-label="Show or hide the answer">Show/Hide Answer</button>
            </div>
        </footer>

    </div>
</body>

</html>
