<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JeoPARODY | Channel O Game Cabinet</title>
    <meta name="description" content="Play JeoPARODY in a dedicated full-window comedy-learning arcade cabinet.">
    <link rel="stylesheet" href="style.css?v=beach-dialogue-1" type="text/css">
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Press+Start+2P&family=Roboto+Condensed:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <script defer src="game-logic.js?v=arcade-4"></script>
    <script defer src="src/contracts/events.js?v=media-1"></script>
    <script defer src="src/core/event-bus.js?v=arcade-2"></script>
    <script defer src="src/core/game-engine.js?v=arcade-4"></script>
    <script defer src="src/data/data-loader.js?v=arcade-2"></script>
    <script defer src="src/media/media-preflight.js?v=media-1"></script>
    <script defer src="src/render/scene-service.js?v=beach-art-2"></script>
    <script defer src="src/render/renderer.js?v=dialogue-skins-1"></script>
    <script defer src="src/render/console-narrator.js?v=media-1"></script>
    <script defer src="src/host/host-manager.js?v=host-catalog-2"></script>
    <script defer src="src/brand/brand-controller.js?v=brand-2"></script>
    <script defer src="src/i18n/translation-service.js?v=i18n-1"></script>
    <script defer src="src/audio/audio-controller.js?v=round-1"></script>
    <script defer src="src/directors/round-director.js?v=round-3"></script>
    <script defer src="app.js?v=dialogue-skins-1"></script>
</head>

<body class="game-only" lang="en" data-theme="dark" data-language="en" data-app-mode="game">
    <main class="game-page-shell" id="play" aria-label="JeoPARODY standalone game">
        <div class="game-container game-container-standalone" id="gameContainer" data-game-moment="loading" data-round-phase="idle">
            <div class="scene-stage" id="sceneStage" aria-hidden="true"></div>
            <header class="header game-header">
                <div class="title-div">
                    <div class="brand-mark game-mark" data-brand-mark aria-label="JeoPARODY">
                        <span class="brand-jeo">JEO</span><span class="brand-par">PAR</span><span class="brand-o" data-brand-o data-o-token="portal" role="button" tabindex="0"><span class="brand-o-core" aria-hidden="true"></span></span><span class="brand-dy">DY</span><span class="brand-bang" aria-hidden="true">!</span>
                    </div>
                </div>
                <div class="header-controls" aria-label="Game preferences">
                    <button class="theme-toggle game-theme-toggle" id="themeToggle" type="button" aria-label="Toggle light or dark mode" aria-pressed="false">
                        <span class="toggle-track" aria-hidden="true">
                            <span class="toggle-bulb"></span>
                        </span>
                        <span class="toggle-label" id="themeToggleLabel">Night</span>
                    </button>
                    <button class="language-toggle" id="languageToggle" type="button" aria-label="Toggle English or Brazilian Portuguese" aria-pressed="false">
                        <span class="flag-stack" aria-hidden="true"><span class="flag flag-us">US</span><span class="flag flag-br">BR</span></span>
                        <span class="toggle-label" id="languageToggleLabel">English</span>
                    </button>
                    <button class="sound-toggle" id="soundToggle" type="button" aria-label="Mute game audio" aria-pressed="false">
                        <span class="sound-icon" aria-hidden="true">SFX</span>
                        <span class="toggle-label" id="soundToggleLabel">Sound</span>
                    </button>
                </div>
                <button class="hamburger-menu" id="hamburgerMenu" type="button" aria-label="Open game menu" aria-expanded="false" aria-controls="navMenu">
                    <span aria-hidden="true">☰</span>
                </button>
            </header>

            <button class="score-drawer" id="scoreDrawer" type="button" aria-label="Show live score" aria-live="polite">
                <span class="quick-score">
                    <span class="hud-readout">
                        <span class="hud-label" id="hudScoreLabel">Score</span>
                        <strong id="hudScore">$0</strong>
                    </span>
                    <span class="hud-readout">
                        <span class="hud-label" id="hudStreakLabel">Streak</span>
                        <strong id="hudStreak">x0</strong>
                    </span>
                </span>
                <span class="score-drawer-tab">Score</span>
            </button>

            <nav class="nav-menu" id="navMenu" aria-label="Game menu">
                <header class="menu-header">
                    <div><small>Channel O</small><p class="nav-kicker">Game Menu</p></div>
                    <button class="menu-close" id="menuClose" type="button" aria-label="Close game menu">×</button>
                </header>
                <section class="menu-section" aria-labelledby="menuScoreTitle">
                    <h2 id="menuScoreTitle">Score</h2>
                    <div id="dataBox" class="data-box">
                        <p id="currentStreak">Current Streak: 0</p>
                        <p id="bestStreak">Best Streak: 0</p>
                        <p id="score">Score: $0</p>
                    </div>
                </section>
                <section class="menu-section menu-action-grid" aria-labelledby="menuRoundTitle">
                    <h2 id="menuRoundTitle">Round</h2>
                    <button id="menuNewClue" type="button"><span>New clue</span><kbd>Q</kbd></button>
                    <button id="menuRevealAnswer" type="button"><span>Reveal answer</span><kbd>A</kbd></button>
                </section>
                <section class="menu-section menu-action-grid" aria-labelledby="menuSettingsTitle">
                    <h2 id="menuSettingsTitle">Settings</h2>
                    <button id="menuTheme" type="button"><span>Day / Night</span><b aria-hidden="true">☀</b></button>
                    <button id="menuLanguage" type="button"><span>English / Português</span><b aria-hidden="true">文</b></button>
                    <button id="menuSound" type="button"><span>Sound</span><b aria-hidden="true">♪</b></button>
                </section>
                <a class="menu-lab-link" href="creative-room.html">Enter the Creative Room <span aria-hidden="true">→</span></a>
            </nav>

            <div class="main-content">
                <div class="speech-bubble" id="speechBubble" data-dialogue-style="clue-card">
                    <div class="dialogue-style-picker" aria-label="Dialogue panel style">
                        <button class="dialogue-style-cycle" id="dialogueStylePrev" type="button" aria-label="Previous dialogue style">‹</button>
                        <span class="dialogue-style-readout">
                            <small>Panel skin</small>
                            <strong id="dialogueStyleLabel">Clue Card</strong>
                            <span id="dialogueStyleIndex" aria-hidden="true">01/04</span>
                        </span>
                        <button class="dialogue-style-cycle" id="dialogueStyleNext" type="button" aria-label="Next dialogue style">›</button>
                    </div>
                    <div class="translation-state" id="translationState" data-status="original" hidden>
                        <span class="translation-pulse" aria-hidden="true"></span>
                        <span id="translationStateLabel">PT</span>
                    </div>
                    <div id="categoryBox" class="clue-header">
                        <h2 class="clue-category">TRANSMISSION READY</h2>
                    </div>
                    <div id="questionBox" class="clue-content" tabindex="0">
                        <p id="clueText" class="clue-text">Approach the studio to load your first clue.</p>
                        <p id="clueOriginal" class="clue-original" lang="en" hidden></p>
                        <div id="clueMedia" class="clue-media" aria-label="Clue media"></div>
                    </div>
                    <div id="answerBox"></div>
                </div>
                <div class="host-stage" id="hostStage" aria-label="Host visual selector">
                    <button class="host-cycle host-cycle-prev" id="hostPrevButton" type="button" aria-label="Previous host look">‹</button>
                    <figure class="host-stand">
                        <img class="trebek" id="hostImage" alt="Xander Trefleck, the provisional JeoPARODY host" src="assets/trebek/trebek-dope-02.png">
                        <span class="host-cue" id="hostCue" aria-hidden="true">On Air</span>
                        <figcaption class="host-skin-label" id="hostSkinLabel">Channel O Xander</figcaption>
                        <span class="host-pack-index" id="hostPackIndex" aria-hidden="true">01/06</span>
                    </figure>
                    <button class="host-cycle host-cycle-next" id="hostNextButton" type="button" aria-label="Next host look">›</button>
                </div>
            </div>

            <footer class="control-footer" aria-label="Contestant controls">
                <div class="input-div">
                    <input type="text" id="inputbox" placeholder="Enter answer" aria-label="Answer input">
                    <button id="checkButton" class="cabinet-button lock-button" type="button" aria-label="Lock It In. Keyboard shortcut: Enter" data-tooltip="Lock It In" data-key="Enter" accesskey="l">
                        <span class="control-symbol lock-symbol" aria-hidden="true"><span class="lock-ring"></span><span class="lock-core">!</span></span>
                        <span class="key-hint key-enter" aria-hidden="true">ENTER</span>
                        <span class="button-tooltip" aria-hidden="true">Lock It In</span>
                    </button>
                </div>
                <div class="button-div">
                    <button id="questionButton" class="cabinet-button clue-button" type="button" aria-label="New Clue. Keyboard shortcut: Q" data-tooltip="New Clue" data-key="Q" accesskey="q">
                        <span class="control-symbol clue-symbol" aria-hidden="true">?</span>
                        <span class="key-hint key-dot" aria-hidden="true">Q</span>
                        <span class="button-tooltip" aria-hidden="true">New Clue</span>
                    </button>
                    <button id="answerButton" class="cabinet-button answer-button" type="button" aria-label="Reveal Answer. Keyboard shortcut: A" data-tooltip="Reveal Answer" data-key="A" accesskey="a">
                        <span class="control-symbol answer-symbol" aria-hidden="true"><span class="eye-lid"></span><span class="eye-pupil">A</span></span>
                        <span class="key-hint key-corner" aria-hidden="true">A</span>
                        <span class="button-tooltip" aria-hidden="true">Reveal Answer</span>
                    </button>
                </div>
            </footer>
            <p id="statusMessage" class="visually-hidden" aria-live="polite"></p>
        </div>
    </main>
</body>

</html>
