name: Loadbearing Godot

on:
  pull_request:
    paths:
      - "apps/loadbearing/**"
      - ".github/workflows/loadbearing-godot.yml"
  push:
    branches:
      - master
    paths:
      - "apps/loadbearing/**"
      - ".github/workflows/loadbearing-godot.yml"

permissions:
  contents: read

jobs:
  test:
    name: Godot 4.7.2 vertical slice
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Static project validation
        run: python apps/loadbearing/scripts/validate_project.py

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Run training domain tests
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 \
            --headless \
            --path apps/loadbearing \
            --script res://tests/test_training_logic.gd

      - name: Parse and boot vertical slice
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 \
            --headless \
            --path apps/loadbearing \
            --quit-after 2
