<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Stadium Performer Lab</title>
  <style>
    :root { color-scheme: dark; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #07110b; }
    #stage { width: 100%; height: 100%; display: block; }
    .hud { position: fixed; left: 16px; top: 16px; z-index: 2; max-width: 420px; padding: 12px 14px; border: 1px solid rgba(255,255,255,.24); border-radius: 10px; background: rgba(0,0,0,.58); backdrop-filter: blur(6px); }
    .hud strong { display: block; margin-bottom: 6px; }
    .hud span { display: block; opacity: .8; font-size: 12px; line-height: 1.45; }
    #status[data-ready="true"] { color: #b8ffcf; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "/node_modules/three/build/three.module.js",
        "three/addons/": "/node_modules/three/examples/jsm/"
      }
    }
  </script>
  <script src="src/character/three-stadium-runtime.js"></script>
</head>
<body>
  <canvas id="stage" aria-label="Animated marching trombonist test scene"></canvas>
  <div class="hud">
    <strong>Stadium Performer Lab v0</strong>
    <span id="status">initializing real Three.js animation + CCD IK…</span>
    <span>Goal: one marching trombonist, two animation layers, two-hand instrument contact.</span>
  </div>
  <script type="module" src="src/dev/stadium-visual-fixture.js"></script>
</body>
</html>
